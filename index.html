<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>教科モンスターバトル｜1問1とう</title>
<meta name="theme-color" content="#172033">
<style>
:root{--bg:#101827;--panel:#1b2943;--panel2:#263957;--ink:#f8fbff;--muted:#b9c6da;--gold:#ffd45a;--green:#62df9a;--red:#ff7373;--blue:#72b9ff;--shadow:0 14px 40px #0007;--radius:22px}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#304d79,#101827 55%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif;min-height:100vh}button,input{font:inherit}button{cursor:pointer;border:0}.app{max-width:1200px;margin:auto;padding:16px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.brand{font-size:clamp(20px,3vw,30px);font-weight:1000}.brand small{display:block;color:var(--muted);font-size:11px}.points{background:#101827;border:1px solid #fff2;border-radius:999px;padding:9px 15px;color:var(--gold);font-weight:1000}.screen{display:none}.screen.active{display:block}.panel{background:linear-gradient(145deg,#1d2b46,#142035);border:1px solid #fff2;border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}.hero{text-align:center;padding:40px 20px}.hero h1{font-size:clamp(34px,7vw,70px);margin:0 0 10px}.hero p{color:var(--muted);line-height:1.8;margin:0 auto 28px}.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;max-width:720px;margin:auto}.btn{min-height:62px;padding:14px 20px;border-radius:17px;background:linear-gradient(180deg,#314767,#243653);color:white;font-weight:1000;box-shadow:0 6px 0 #0b1220;border:1px solid #fff2}.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #0b1220}.btn.primary{background:linear-gradient(180deg,#f6c951,#d99d22);color:#241b07}.btn.green{background:linear-gradient(180deg,#67e2a0,#36b978);color:#072016}.btn.small{min-height:44px;padding:9px 14px;border-radius:13px;box-shadow:0 4px 0 #0b1220}.back{margin-bottom:14px}.title{font-size:26px;margin:0 0 16px;font-weight:1000}.choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.choice{min-height:72px;padding:14px;border-radius:17px;background:#263957;color:white;border:2px solid transparent;font-weight:1000}.choice.selected{border-color:var(--gold);background:#34476a;box-shadow:0 0 0 3px #ffd45a22}.choice small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.battle{display:grid;grid-template-columns:220px minmax(300px,1fr) minmax(350px,1.1fr);gap:14px}.battle-side,.arena,.qpanel{min-height:590px}.battle-side{display:flex;flex-direction:column;gap:12px}.team{display:grid;grid-template-columns:1fr;gap:9px}.mini{display:grid;grid-template-columns:58px 1fr;gap:8px;align-items:center;background:#ffffff09;border-radius:13px;padding:7px;border:2px solid transparent}.mini.active{border-color:var(--gold)}.mini img{width:58px;height:58px;object-fit:contain}.mini b{font-size:12px}.mini span{display:block;color:var(--muted);font-size:10px}.arena{position:relative;overflow:hidden;border-radius:var(--radius);padding:18px;background:linear-gradient(180deg,#29435d,#18283b 65%,#101925);display:flex;flex-direction:column}.progress{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;font-weight:900}.monster-wrap{flex:1;display:flex;align-items:center;justify-content:center;position:relative}.monster{width:min(75%,360px);max-height:350px;object-fit:contain;filter:drop-shadow(0 20px 15px #0009)}.monster.hit{animation:hit .35s}.monster.defeat{animation:defeat .55s forwards}.hp-line{display:flex;justify-content:space-between;font-weight:1000;margin-bottom:6px}.bar{height:15px;background:#09101c;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ff6b6b,#ffb14e);transition:.3s;width:100%}.feedback{position:absolute;left:50%;top:45%;z-index:4;font-size:clamp(34px,6vw,70px);font-weight:1000;text-shadow:0 6px 18px #000;pointer-events:none;opacity:0;transform:translate(-50%,-50%)}.feedback.show{animation:pop .75s}.feedback.good{color:var(--green)}.feedback.great{color:var(--gold)}.feedback.bad{color:#ffaaaa}.qpanel{display:flex;flex-direction:column}.badge{display:inline-block;background:#fff1;border-radius:999px;padding:7px 10px;color:var(--muted);font-size:12px;font-weight:900}.qtext{font-size:clamp(24px,3.3vw,40px);font-weight:1000;line-height:1.5;margin:22px 0}.hint{display:none;background:#fff9d8;color:#493b00;padding:12px;border-radius:13px;font-weight:900;margin-bottom:10px}.hint.show{display:block}.answer{width:100%;font-size:clamp(28px,4vw,42px);padding:14px;text-align:center;border-radius:16px;border:2px solid #fff2;background:#0d1625;color:white}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.key{min-height:50px;border-radius:13px;background:#293b59;color:#fff;font-weight:1000}.key.enter{background:#39c67a;color:#06190f}.key.clear{background:#80505b}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}.card{aspect-ratio:2/3;border-radius:18px;padding:8px;background:linear-gradient(145deg,#f9d768,#a87922 48%,#43320f);border:2px solid #ffe69a;box-shadow:0 10px 25px #0008;overflow:hidden}.card-inner{height:100%;border-radius:12px;padding:9px;background:linear-gradient(160deg,#263c59dd,#111a2ddd);display:flex;flex-direction:column}.card img{width:100%;flex:1;min-height:0;object-fit:contain;filter:drop-shadow(0 10px 8px #0009)}.card-rare{font-size:10px;color:#ffe18a;font-weight:1000}.card-name{font-weight:1000;font-size:14px}.card-meta{font-size:10px;color:#d6e1f0;margin-top:4px}.pack-area{text-align:center}.pack{width:min(260px,70vw);aspect-ratio:2/3;margin:20px auto;background:radial-gradient(circle,#ffe57b,#7d3c7d 55%,#17243a);border:5px solid #ffd65b;border-radius:25px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;box-shadow:0 20px 50px #0008}.pack span{font-size:30px;font-weight:1000;text-shadow:0 4px 12px #000}.result{text-align:center}.reward{font-size:23px;color:var(--gold);font-weight:1000}.modal{position:fixed;inset:0;background:#050a12cc;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.show{display:flex}.modal-box{width:min(480px,100%);background:#1b2943;border:1px solid #fff2;border-radius:25px;padding:22px;text-align:center}.new-card{width:190px;margin:10px auto}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);opacity:0;background:#09111f;border:1px solid #fff2;padding:11px 18px;border-radius:999px;font-weight:900;z-index:30}.toast.show{opacity:1;transform:translate(-50%,0);transition:.2s}@keyframes hit{25%{transform:translateX(15px) rotate(4deg);filter:brightness(1.8)}}@keyframes defeat{to{transform:scale(.1) rotate(25deg);opacity:0}}@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-65%) scale(1)}}@media(max-width:900px){.battle{grid-template-columns:1fr}.battle-side{order:3}.arena{order:1;min-height:430px}.qpanel{order:2;min-height:auto}.team{grid-template-columns:repeat(3,1fr)}.mini{grid-template-columns:1fr;text-align:center}.mini img{margin:auto}.battle-side{min-height:auto}.choice-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.app{padding:10px}.menu{grid-template-columns:1fr}.panel{padding:14px}.choice-grid{grid-template-columns:1fr 1fr}.qtext{margin:12px 0}.team{gap:5px}.mini{padding:5px}.mini img{width:48px;height:48px}}
</style>
<script src="data/subjects.js"></script>
<script src="data/questions/grade1/life.js"></script>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">教科モンスターバトル<small>1問1とう × カードバトル</small></div><div class="points">カードP <span id="points">0</span></div></header>
<section id="home" class="screen active"><div class="panel hero"><h1>教科モンスターバトル</h1><p>1問解く。攻撃する。モンスターを倒す。<br>学ぶほど、カードが集まる。</p><div class="menu"><button class="btn primary" onclick="show('setup')">バトルする</button><button class="btn" onclick="show('cards')">カード</button><button class="btn" onclick="show('packs')">カードパック</button><button class="btn" onclick="show('review')">まちがえた問題</button></div></div></section>
<section id="setup" class="screen"><button class="btn small back" onclick="show('home')">← もどる</button><div class="panel"><h2 class="title">バトルのじゅんび</h2><p>① 学年をえらぼう</p><div id="grades" class="choice-grid"></div><p>② 教科をえらぼう</p><div id="subjects" class="choice-grid"></div><div style="text-align:center;margin-top:20px"><button class="btn primary" onclick="startBattle()">バトルスタート！</button></div></div></section>
<section id="battleScreen" class="screen"><div class="battle"><aside class="battle-side"><div class="panel"><div style="font-weight:1000;color:var(--muted);font-size:13px">ぼくのチーム</div><div id="miniTeam" class="team"></div></div><div class="panel"><button class="btn small" style="width:100%" onclick="quitBattle()">バトルをやめる</button></div></aside><main class="arena"><div class="progress"><span id="battleInfo">1 / 5</span><span id="subjectInfo">算数</span></div><div class="monster-wrap"><img id="monsterImg" class="monster"><div id="feedback" class="feedback"></div></div><div><div class="hp-line"><span id="monsterName">モンスター</span><span><b id="monsterHp">1</b> / <b id="monsterMax">1</b></span></div><div class="bar"><i id="monsterBar"></i></div></div></main><section class="panel qpanel"><span id="qBadge" class="badge">6年・算数</span><div id="questionText" class="qtext">問題</div><div id="hint" class="hint"></div><input id="answer" class="answer" inputmode="numeric" autocomplete="off" placeholder="答えを入力" onkeydown="if(event.key==='Enter')submitAnswer()"><div class="keypad"><button class="key" onclick="key('1')">1</button><button class="key" onclick="key('2')">2</button><button class="key" onclick="key('3')">3</button><button class="key" onclick="key('4')">4</button><button class="key" onclick="key('5')">5</button><button class="key" onclick="key('6')">6</button><button class="key" onclick="key('7')">7</button><button class="key" onclick="key('8')">8</button><button class="key" onclick="key('9')">9</button><button class="key clear" onclick="key('C')">けす</button><button class="key" onclick="key('0')">0</button><button class="key enter" onclick="submitAnswer()">こたえる</button></div><div style="margin-top:auto;padding-top:12px;color:var(--muted);font-size:12px;font-weight:800">まちがえたらヒントを見て、もう一度！</div></section></div></section>
<section id="cards" class="screen"><button class="btn small back" onclick="show('home')">← もどる</button><div class="panel"><h2 class="title">モンスターカード</h2><p style="color:var(--muted)">持っているカード：<b id="cardCount">0</b>枚</p><div id="cardsGrid" class="cards"></div></div></section>
<section id="packs" class="screen"><button class="btn small back" onclick="show('home')">← もどる</button><div class="panel pack-area"><h2 class="title">カードパック</h2><p>100Pで1枚ゲット！ 同じカードなら50Pもどってくるよ。</p><div class="pack"><span>MONSTER<br>PACK</span></div><button class="btn primary" onclick="openPack()">100Pでひく</button></div></section>
<section id="review" class="screen"><button class="btn small back" onclick="show('home')">← もどる</button><div class="panel"><h2 class="title">まちがえた問題</h2><div id="reviewList"></div></div></section>
<section id="result" class="screen"><div class="panel result"><h2 id="resultTitle">バトル終了！</h2><p id="resultText"></p><div class="reward">+<span id="resultPoints">0</span>P</div><div style="margin-top:20px"><button class="btn primary" onclick="show('home')">ホームへ</button></div></div></section>
</div>
<div id="modal" class="modal"><div class="modal-box"><h2>NEW CARD!</h2><div id="newCard"></div><button class="btn primary" onclick="closeModal()">やった！</button></div></div>
<div id="toast" class="toast"></div>
<script>
const BASE='https://tt-sensei.github.io/navi-character-/assets/web/fantasy/monsters/';
const monsters=[
{id:'purun-slime',name:'ぷるんスライム',tier:'zako',hp:1,specialty:'算数',image:'bubblefin-frog.webp'},
{id:'komorin-bat',name:'こもりんナイトバット',tier:'zako',hp:1,specialty:'国語',image:'dusk-feather-owl.webp'},
{id:'kinoko',name:'きのこっこ',tier:'zako',hp:1,specialty:'生活',image:'autumn-mushroom.webp'},
{id:'leafy-squirrel',name:'はっぱリス',tier:'zako',hp:1,specialty:'理科',image:'acorn-leafy.webp'},
{id:'candy-slug',name:'キャンディスラッグ',tier:'zako',hp:1,specialty:'社会',image:'candy-coral-slug.webp'},
{id:'coral-crab',name:'コーラルクラブ',tier:'evolved',hp:2,specialty:'理科',image:'coral-bubble-crab.webp'},
{id:'cloud-rabbit',name:'くもりんラビット',tier:'evolved',hp:2,specialty:'国語',image:'cloud-rain-rabbit.webp'},
{id:'cobalt-mantis',name:'コバルトマンティス',tier:'evolved',hp:2,specialty:'算数',image:'cobalt-blade-mantis.webp'},
{id:'cogwheel-beetle',name:'コグホイールビートル',tier:'boss',hp:3,specialty:'社会',image:'cogwheel-beetle.webp'},
{id:'aurora-lizard',name:'オーロラシェルリザード',tier:'boss',hp:3,specialty:'理科',image:'aurora-shell-lizard.webp'}
];
const fallback={
国語:[['「うれしい」の反対の気持ちは？','かなしい'],['「学校」をひらがなで書くと？','がっこう']],
算数:[['3+4は？','7'],['8×2は？','16'],['12÷3は？','4']],
生活:[['春にさく花としてよく知られているものは？','さくら'],['学校の近くの町を歩いて調べる活動を何という？','まちたんけん'],['植物を大切に育てるために必要なものは？','みず']],
理科:[['植物が成長するために必要なものを一つ答えよう。','ひかり'],['水を熱するとどうなる？','水蒸気']],
社会:[['日本の首都は？','東京'],['地図で方角を表すとき、上はふつう何の方角？','北']]
};
let state={points:+localStorage.getItem('1mon_points')||0,owned:JSON.parse(localStorage.getItem('1mon_owned')||'[0,1,2]'),team:JSON.parse(localStorage.getItem('1mon_team')||'[0,1,2]'),wrong:JSON.parse(localStorage.getItem('1mon_wrong')||'[]')};
let battle={grade:6,subject:'算数',questions:[],index:0,monster:null,monsterHp:1,asked:'',wrongOnce:false,gained:0};
function save(){localStorage.setItem('1mon_points',state.points);localStorage.setItem('1mon_owned',JSON.stringify(state.owned));localStorage.setItem('1mon_team',JSON.stringify(state.team));localStorage.setItem('1mon_wrong',JSON.stringify(state.wrong));document.getElementById('points').textContent=state.points}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');if(id==='setup')renderSetup();if(id==='cards')renderCards();if(id==='review')renderReview();save()}
function renderSetup(){document.getElementById('grades').innerHTML=[1,2,3,4,5,6].map(g=>`<button class="choice ${battle.grade===g?'selected':''}" onclick="battle.grade=${g};if(!getSubjects().includes(battle.subject))battle.subject='ランダム';renderSetup()">${g}年生</button>`).join('');let ss=['ランダム',...getSubjects()];document.getElementById('subjects').innerHTML=ss.map(s=>`<button class="choice ${battle.subject===s?'selected':''}" onclick="battle.subject='${s}';renderSetup()">${s==='ランダム'?'🎲 ':GAME_SUBJECTS[s]?.icon||''} ${s}<small>${s==='ランダム'?'この学年の教科からランダム':subjectName(s)}</small></button>`).join('')}
function getSubjects(){return window.getSubjectsForGrade?window.getSubjectsForGrade(battle.grade):Object.keys(GAME_SUBJECTS).filter(s=>GAME_SUBJECTS[s].grades.includes(battle.grade))}
function subjectName(s){return `${battle.grade}年で学べる教科`}
function getQuestions(){let subjects=battle.subject==='ランダム'?getSubjects():[battle.subject];let arr=[];subjects.forEach(s=>{if(s==='生活'&&window.GRADE1_LIFE_QUESTIONS&&battle.grade===1){arr.push(...window.GRADE1_LIFE_QUESTIONS.map(q=>({subject:s,text:q.question,answer:String(q.answer),hint:q.hint||'教科書で学んだことを思い出そう。'})))}else{(fallback[s]||[]).forEach(q=>arr.push({subject:s,text:q[0],answer:q[1],hint:'もう一度問題をゆっくり読もう。'}))}});return arr.sort(()=>Math.random()-.5)}
function chooseMonster(){let r=Math.random();let pool=r<.12?monsters.filter(m=>m.tier==='boss'):r<.35?monsters.filter(m=>m.tier==='evolved'):monsters.filter(m=>m.tier==='zako');return pool[Math.floor(Math.random()*pool.length)]}
function startBattle(){battle.questions=getQuestions();if(!battle.questions.length){toast('問題がまだありません');return}battle.questions=Array.from({length:5},(_,i)=>battle.questions[i%battle.questions.length]);battle.index=0;battle.gained=0;battle.monster=chooseMonster();battle.monsterHp=battle.monster.hp;show('battleScreen');renderTeam();loadQuestion()}
function loadQuestion(){let q=battle.questions[battle.index];battle.asked=q.text;battle.wrongOnce=false;document.getElementById('battleInfo').textContent=`${battle.index+1} / ${battle.questions.length}`;document.getElementById('subjectInfo').textContent=q.subject;document.getElementById('qBadge').textContent=`${battle.grade}年・${q.subject}`;document.getElementById('questionText').textContent=q.text;document.getElementById('hint').textContent=q.hint;document.getElementById('hint').classList.remove('show');document.getElementById('answer').value='';document.getElementById('answer').focus();renderMonster()}
function renderMonster(){let m=battle.monster;let img=document.getElementById('monsterImg');img.src=BASE+m.image;img.alt=m.name;document.getElementById('monsterName').textContent=m.name;document.getElementById('monsterHp').textContent=battle.monsterHp;document.getElementById('monsterMax').textContent=m.hp;document.getElementById('monsterBar').style.width=(battle.monsterHp/m.hp*100)+'%'}
function key(v){let a=document.getElementById('answer');if(v==='C')a.value='';else if(a.value.length<8)a.value+=v;a.focus()}
function submitAnswer(){let q=battle.questions[battle.index],a=document.getElementById('answer').value.trim();if(!a)return;if(String(a).toLowerCase()===String(q.answer).toLowerCase()){correct(q)}else{wrong(q)}}
function correct(q){let damage=battle.monster.specialty===q.subject?2:1;battle.monsterHp=Math.max(0,battle.monsterHp-damage);battle.gained+=10;state.points+=10;showFeedback(battle.monster.specialty===q.subject?'とくい！':'せいかい！',battle.monster.specialty===q.subject?'great':'good');hitMonster();if(battle.monsterHp<=0){setTimeout(()=>{battle.index++;if(battle.index>=battle.questions.length)finishBattle();else{battle.monster=chooseMonster();battle.monsterHp=battle.monster.hp;loadQuestion()}},650)}else{setTimeout(()=>loadQuestion(),550)}save()}
function wrong(q){showFeedback('おしい！','bad');document.getElementById('hint').classList.add('show');if(!battle.wrongOnce){state.wrong.push({grade:battle.grade,subject:q.subject,text:q.text,answer:q.answer,hint:q.hint});state.wrong=state.wrong.slice(-30);battle.wrongOnce=true;save()}document.getElementById('answer').value='';document.getElementById('answer').focus()}
function hitMonster(){let i=document.getElementById('monsterImg');i.classList.remove('hit');void i.offsetWidth;i.classList.add('hit');renderMonster()}
function showFeedback(t,c){let f=document.getElementById('feedback');f.textContent=t;f.className='feedback show '+c;setTimeout(()=>f.className='feedback',800)}
function renderTeam(){document.getElementById('miniTeam').innerHTML=state.team.map((id,i)=>{let m=monsters[id]||monsters[0];return `<div class="mini ${i===0?'active':''}"><img src="${BASE+m.image}"><div><b>${m.name}</b><span>得意：${m.specialty}</span></div></div>`}).join('')}
function finishBattle(){let bonus=battle.monster.tier==='boss'?20:0;state.points+=bonus;battle.gained+=bonus;document.getElementById('resultTitle').textContent='バトルクリア！';document.getElementById('resultText').textContent='5問の学習をクリアしたよ！';document.getElementById('resultPoints').textContent=battle.gained;show('result');save()}
function quitBattle(){if(confirm('バトルをやめますか？'))show('home')}
function renderCards(){document.getElementById('cardCount').textContent=state.owned.length;document.getElementById('cardsGrid').innerHTML=state.owned.map(id=>{let m=monsters[id]||monsters[0];return `<div class="card"><div class="card-inner"><span class="card-rare">${m.tier==='boss'?'BOSS':m.tier==='evolved'?'EVOLVED':'NORMAL'}</span><img src="${BASE+m.image}" alt="${m.name}"><div class="card-name">${m.name}</div><div class="card-meta">HP ${m.hp} ・ 得意 ${m.specialty}</div></div></div>`}).join('')}
function renderReview(){let el=document.getElementById('reviewList');if(!state.wrong.length){el.innerHTML='<div style="padding:30px;text-align:center;color:var(--muted)">まだまちがえた問題はないよ！</div>';return}el.innerHTML=state.wrong.slice().reverse().map(q=>`<div class="panel" style="margin-bottom:10px;background:#ffffff08"><b>${q.grade}年・${q.subject}</b><div style="font-size:20px;font-weight:1000;margin:8px 0">${q.text}</div><div style="color:var(--muted)">答え：${q.answer}</div><div style="color:#fff9d8;margin-top:5px">ヒント：${q.hint}</div></div>`).join('')}
function openPack(){if(state.points<100){toast('100Pためてからひこう！');return}state.points-=100;let id=Math.floor(Math.random()*monsters.length);let duplicate=state.owned.includes(id);if(!duplicate)state.owned.push(id);else state.points+=50;let m=monsters[id]||monsters[0];document.getElementById('newCard').innerHTML=`<div class="card new-card"><div class="card-inner"><span class="card-rare">${duplicate?'GET AGAIN':'NEW!'}</span><img src="${BASE+m.image}" alt="${m.name}"><div class="card-name">${m.name}</div><div class="card-meta">HP ${m.hp} ・ 得意 ${m.specialty}</div></div></div><p>${duplicate?'同じカードだったので50Pゲット！':'新しいカードをゲット！'}</p>`;document.getElementById('modal').classList.add('show');save()}
function closeModal(){document.getElementById('modal').classList.remove('show');renderCards()}
let toastTimer;function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('show'),1800)}
renderSetup();save();
</script>
</body>
</html>

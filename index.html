<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>教科モンスターバトル｜1問1とう</title>
<style>
:root{--bg:#101827;--panel:#1b2943;--panel2:#263957;--ink:#fff;--muted:#b9c6da;--gold:#ffd45a;--green:#62df9a;--red:#ff7777;--radius:20px}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#304d79,#101827 58%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif;min-height:100vh}button{font:inherit;border:0;cursor:pointer}.app{max-width:1200px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.brand{font-size:clamp(20px,3vw,30px);font-weight:1000}.brand small{display:block;font-size:11px;color:var(--muted)}.points{background:#101827;border:1px solid #fff2;border-radius:99px;padding:9px 15px;color:var(--gold);font-weight:1000}.screen{display:none}.screen.active{display:block}.panel{background:linear-gradient(145deg,#1d2b46,#142035);border:1px solid #fff2;border-radius:var(--radius);box-shadow:0 14px 40px #0007;padding:20px}.hero{text-align:center;padding:45px 20px}.hero h1{font-size:clamp(36px,7vw,72px);margin:0 0 10px}.hero p{color:var(--muted);line-height:1.8}.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;max-width:700px;margin:28px auto 0}.btn{min-height:62px;padding:14px 20px;border-radius:17px;background:linear-gradient(180deg,#314767,#243653);color:#fff;font-weight:1000;box-shadow:0 6px 0 #0b1220}.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #0b1220}.primary{background:linear-gradient(180deg,#f6c951,#d99d22);color:#241b07}.small{min-height:44px;padding:9px 14px;border-radius:13px;box-shadow:0 4px 0 #0b1220}.back{margin-bottom:14px}.title{font-size:27px;margin:0 0 18px}.section-label{font-weight:1000;color:var(--muted);margin:18px 0 10px}.choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.choice{min-height:76px;border-radius:17px;background:#263957;color:#fff;border:2px solid transparent;padding:12px;font-weight:1000}.choice.selected{border-color:var(--gold);background:#34476a;box-shadow:0 0 0 3px #ffd45a22}.choice .icon{font-size:25px;display:block}.choice small{color:var(--muted);font-size:11px}.setup-note{text-align:center;color:var(--muted);font-size:13px;margin-top:15px}.battle{display:grid;grid-template-columns:220px minmax(300px,1fr) minmax(360px,1.1fr);gap:14px}.arena,.qpanel{min-height:590px}.arena{position:relative;overflow:hidden;border-radius:var(--radius);padding:18px;background:linear-gradient(180deg,#29435d,#18283b 65%,#101925);display:flex;flex-direction:column}.progress{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;font-weight:900}.monster-wrap{flex:1;display:flex;align-items:center;justify-content:center;position:relative}.monster{width:min(75%,350px);max-height:350px;object-fit:contain;filter:drop-shadow(0 20px 15px #0009)}.hit{animation:hit .35s}.defeat{animation:defeat .55s forwards}.hp-line{display:flex;justify-content:space-between;font-weight:1000;margin-bottom:6px}.bar{height:15px;background:#09101c;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ff6b6b,#ffb14e);transition:.3s;width:100%}.feedback{position:absolute;left:50%;top:45%;z-index:4;font-size:clamp(35px,6vw,70px);font-weight:1000;text-shadow:0 6px 18px #000;pointer-events:none;opacity:0;transform:translate(-50%,-50%)}.feedback.show{animation:pop .75s}.good{color:var(--green)}.great{color:var(--gold)}.bad{color:#ffaaaa}.qpanel{display:flex;flex-direction:column}.badge{display:inline-block;background:#fff1;border-radius:99px;padding:7px 10px;color:var(--muted);font-size:12px;font-weight:900}.qtext{font-size:clamp(25px,3.3vw,40px);font-weight:1000;line-height:1.5;margin:22px 0}.hint{display:none;background:#fff9d8;color:#493b00;padding:12px;border-radius:13px;font-weight:900;margin-bottom:10px}.hint.show{display:block}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:auto}.answer-choice{min-height:82px;border-radius:18px;background:#263957;color:#fff;border:2px solid #fff2;font-weight:1000;font-size:clamp(17px,2.2vw,25px);padding:10px;box-shadow:0 5px 0 #0b1220}.answer-choice:active{transform:translateY(3px);box-shadow:0 2px 0 #0b1220}.answer-choice.lock{pointer-events:none;opacity:.65}.mini-team{display:grid;gap:9px}.mini{display:grid;grid-template-columns:58px 1fr;gap:8px;align-items:center;background:#ffffff09;border-radius:13px;padding:7px;border:2px solid transparent}.mini.active{border-color:var(--gold)}.mini img{width:58px;height:58px;object-fit:contain}.mini b{font-size:12px}.mini span{display:block;color:var(--muted);font-size:10px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}.card{aspect-ratio:2/3;border-radius:18px;padding:8px;background:linear-gradient(145deg,#f9d768,#a87922 48%,#43320f);border:2px solid #ffe69a;box-shadow:0 10px 25px #0008;overflow:hidden}.card-inner{height:100%;border-radius:12px;padding:9px;background:linear-gradient(160deg,#263c59dd,#111a2ddd);display:flex;flex-direction:column}.card img{width:100%;flex:1;min-height:0;object-fit:contain}.card-rare{font-size:10px;color:#ffe18a;font-weight:1000}.card-name{font-weight:1000;font-size:14px}.card-meta{font-size:10px;color:#d6e1f0;margin-top:4px}.pack{text-align:center}.pack-box{width:min(260px,70vw);aspect-ratio:2/3;margin:20px auto;background:radial-gradient(circle,#ffe57b,#7d3c7d 55%,#17243a);border:5px solid #ffd65b;border-radius:25px;display:flex;align-items:center;justify-content:center;box-shadow:0 20px 50px #0008}.pack-box span{font-size:30px;font-weight:1000}.result{text-align:center}.reward{font-size:23px;color:var(--gold);font-weight:1000}.review-item{background:#ffffff09;border-radius:14px;padding:13px;margin:8px 0}.modal{position:fixed;inset:0;background:#050a12cc;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.show{display:flex}.modal-box{width:min(480px,100%);background:#1b2943;border:1px solid #fff2;border-radius:25px;padding:22px;text-align:center}.new-card{width:190px;margin:10px auto}@keyframes hit{25%{transform:translateX(15px) rotate(4deg);filter:brightness(1.8)}}@keyframes defeat{to{transform:scale(.1) rotate(25deg);opacity:0}}@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-65%) scale(1)}}@media(max-width:900px){.battle{grid-template-columns:1fr}.arena{order:1;min-height:430px}.qpanel{order:2;min-height:auto}.battle>aside{order:3}.mini-team{grid-template-columns:repeat(3,1fr)}.mini{grid-template-columns:1fr;text-align:center}.mini img{margin:auto}.choice-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.app{padding:10px}.menu{grid-template-columns:1fr}.panel{padding:14px}.choice-grid{grid-template-columns:1fr 1fr}.choices{gap:8px}.answer-choice{min-height:76px}.mini img{width:45px;height:45px}.mini span{display:none}}
</style>
<script src="data/subjects.js"></script>
<script src="data/questions/grade1/japanese.js"></script>
<script src="data/questions/grade1/math.js"></script>
<script src="data/questions/grade1/life.js"></script>
<script src="data/questions/grade1/english.js"></script>
<script src="data/questions/grade2/japanese.js"></script>
<script src="data/questions/grade2/math.js"></script>
<script src="data/questions/grade2/life.js"></script>
<script src="data/questions/grade2/english.js"></script>
</head>
<body><div class="app">
<header class="top"><div class="brand">教科モンスターバトル<small>1問1とう</small></div><div class="points">カードP <span id="points">0</span></div></header>
<section id="home" class="screen active"><div class="panel hero"><h1>教科モンスターバトル</h1><p>1問とく → こうげき！<br>モンスターをたおして、カードをあつめよう。</p><div class="menu"><button class="btn primary" onclick="openSetup()">バトルする</button><button class="btn" onclick="show('cards');renderCards()">カード</button><button class="btn" onclick="show('packs')">カードパック</button><button class="btn" onclick="show('review');renderReview()">まちがえた問題</button></div></div></section>
<section id="setup" class="screen"><button class="btn small back" onclick="show('home')">← もどる</button><div class="panel"><h2 class="title">バトルのじゅんび</h2><div class="section-label">① 学年をえらぼう</div><div id="grades" class="choice-grid"></div><div class="section-label">② 教科をえらぼう</div><div id="subjects" class="choice-grid"></div><div id="setupNote" class="setup-note">学年をえらぶと、その学年の教科が出てくるよ。</div><div style="text-align:center;margin-top:20px"><button id="startButton" class="btn primary" onclick="startBattle()">バトルスタート！</button></div></div></section>
<section id="battleScreen" class="screen"><div class="battle"><aside><div class="panel"><div style="font-weight:1000;color:var(--muted);font-size:13px;margin-bottom:8px">ぼくのチーム</div><div id="miniTeam" class="mini-team"></div></div><div class="panel" style="margin-top:12px"><button class="btn small" style="width:100%" onclick="quitBattle()">やめる</button></div></aside><main class="arena"><div class="progress"><span id="battleInfo">1 / 5</span><span id="subjectInfo">国語</span></div><div class="monster-wrap"><img id="monsterImg" class="monster" alt="モンスター"><div id="feedback" class="feedback"></div></div><div><div class="hp-line"><span id="monsterName">モンスター</span><span><b id="monsterHp">1</b> / <b id="monsterMax">1</b></span></div><div class="bar"><i id="monsterBar"></i></div></div></main><section class="panel qpanel"><span id="qBadge" class="badge">1年・国語</span><div id="questionText" class="qtext">問題</div><div id="hint" class="hint"></div><div id="choices" class="choices"></div><div style="margin-top:12px;color:var(--muted);font-size:12px;font-weight:800">まちがえても大丈夫。ヒントを見て、もう一度考えよう！</div></section></div></section>
<section id="cards" class="screen"><button class="btn small back" onclick="show('home')">← もどる</button><div class="panel"><h2 class="title">モンスターカード</h2><p style="color:var(--muted)">持っているカード：<b id="cardCount">0</b>枚</p><div id="cardsGrid" class="cards"></div></div></section>
<section id="packs" class="screen"><button class="btn small back" onclick="show('home')">← もどる</button><div class="panel pack"><h2 class="title">カードパック</h2><p>100Pで1枚！ 同じカードなら50Pもどるよ。</p><div class="pack-box"><span>MONSTER<br>PACK</span></div><button class="btn primary" onclick="openPack()">100Pでひく</button></div></section>
<section id="review" class="screen"><button class="btn small back" onclick="show('home')">← もどる</button><div class="panel"><h2 class="title">まちがえた問題</h2><div id="reviewList"></div></div></section>
<section id="result" class="screen"><div class="panel result"><h2 id="resultTitle">バトル終了！</h2><p id="resultText"></p><div class="reward">+<span id="resultPoints">0</span>P</div><div style="margin-top:20px"><button class="btn primary" onclick="show('home')">ホームへ</button></div></div></section>
</div><div id="modal" class="modal"><div class="modal-box"><h2>NEW CARD!</h2><div id="newCard"></div><button class="btn primary" onclick="closeModal()">やった！</button></div></div>
<script>
const MONSTERS=[
{id:'purun-slime',name:'ぷるんスライム',hp:1,specialty:'算数',rarity:'ノーマル',image:'https://tt-sensei.github.io/navi-character-/assets/web/fantasy/monsters/zako/bubblefin-frog.webp'},
{id:'komorin-bat',name:'こもりんナイトバット',hp:1,specialty:'国語',rarity:'ノーマル',image:'https://tt-sensei.github.io/navi-character-/assets/web/fantasy/monsters/zako/dusk-feather-owl.webp'},
{id:'kinoko',name:'きのこっこ',hp:1,specialty:'生活',rarity:'ノーマル',image:'https://tt-sensei.github.io/navi-character-/assets/web/fantasy/monsters/zako/autumn-mushroom.webp'},
{id:'candy-slug',name:'キャンディスラッグ',hp:2,specialty:'英語',rarity:'レア',image:'https://tt-sensei.github.io/navi-character-/assets/web/fantasy/monsters/zako/candy-coral-slug.webp'},
{id:'cogwheel',name:'コグホイールビートル',hp:2,specialty:'算数',rarity:'レア',image:'https://tt-sensei.github.io/navi-character-/assets/web/fantasy/monsters/zako/cogwheel-beetle.webp'}];
const state={grade:1,subject:'国語',qIndex:0,questions:[],lastId:null,monster:null,monsterHp:1,points:+localStorage.getItem('1m1t_points')||0,cards:JSON.parse(localStorage.getItem('1m1t_cards')||'["purun-slime","komorin-bat","kinoko"]'),team:JSON.parse(localStorage.getItem('1m1t_team')||'["purun-slime","komorin-bat","kinoko"]'),wrong:JSON.parse(localStorage.getItem('1m1t_wrong')||'[]')};
function save(){localStorage.setItem('1m1t_points',state.points);localStorage.setItem('1m1t_cards',JSON.stringify(state.cards));localStorage.setItem('1m1t_team',JSON.stringify(state.team));localStorage.setItem('1m1t_wrong',JSON.stringify(state.wrong));document.getElementById('points').textContent=state.points}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0)}
function openSetup(){show('setup');renderGrades();renderSubjects()}
function renderGrades(){const el=document.getElementById('grades');el.innerHTML='';for(let g=1;g<=6;g++){const b=document.createElement('button');b.className='choice'+(state.grade===g?' selected':'');b.innerHTML='<span class="icon">🎒</span>'+g+'年生';b.onclick=()=>{state.grade=g;state.subject=null;renderGrades();renderSubjects()};el.appendChild(b)}}
function renderSubjects(){const el=document.getElementById('subjects');el.innerHTML='';const list=window.getSubjectsForGrade(state.grade);if(!state.subject||!list.includes(state.subject))state.subject=list[0]||null;list.forEach(s=>{const d=window.GAME_SUBJECTS[s];const b=document.createElement('button');b.className='choice'+(state.subject===s?' selected':'');b.innerHTML='<span class="icon">'+d.icon+'</span>'+s;b.onclick=()=>{state.subject=s;renderSubjects()};el.appendChild(b)});const r=document.createElement('button');r.className='choice'+(state.subject==='教科ランダム'?' selected':'');r.innerHTML='<span class="icon">🎲</span>教科ランダム<small>この学年の教科から</small>';r.onclick=()=>{state.subject='教科ランダム';renderSubjects()};el.appendChild(r);document.getElementById('setupNote').textContent=state.subject==='教科ランダム'?state.grade+'年生の教科からランダムに出題するよ。':state.grade+'年生・'+state.subject+'をえらんでいるよ。'}
function getQuestions(){let subjects=state.subject==='教科ランダム'?window.getSubjectsForGrade(state.grade):[state.subject];let pool=[];subjects.forEach(s=>{const key=state.grade+'-'+window.GAME_SUBJECTS[s].id;const q=window.QUESTION_BANK[key]||[];pool.push(...q)});pool=pool.filter(q=>q.id!==state.lastId);for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}return pool.slice(0,5)}
function startBattle(){if(!state.subject)return;state.questions=getQuestions();if(!state.questions.length){alert('この学年・教科の問題は、まだ準備中だよ。');return}state.qIndex=0;state.lastId=null;spawnMonster();show('battleScreen');renderTeam();renderQuestion()}
function spawnMonster(){state.monster=MONSTERS[Math.floor(Math.random()*MONSTERS.length)];state.monsterHp=state.monster.hp;document.getElementById('monsterImg').src=state.monster.image;document.getElementById('monsterImg').className='monster';document.getElementById('monsterName').textContent=state.monster.name;document.getElementById('monsterHp').textContent=state.monsterHp;document.getElementById('monsterMax').textContent=state.monster.hp;document.getElementById('monsterBar').style.width='100%'}
function renderTeam(){const el=document.getElementById('miniTeam');el.innerHTML='';state.team.forEach(id=>{const c=MONSTERS.find(x=>x.id===id)||MONSTERS[0];const d=document.createElement('div');d.className='mini';d.innerHTML='<img src="'+c.image+'"><div><b>'+c.name+'</b><span>得意：'+c.specialty+'</span></div>';el.appendChild(d)})}
function renderQuestion(){const q=state.questions[state.qIndex];if(!q){finishBattle();return}const subj=q.subject;document.getElementById('battleInfo').textContent=(state.qIndex+1)+' / '+state.questions.length;document.getElementById('subjectInfo').textContent=subj;document.getElementById('qBadge').textContent=state.grade+'年・'+subj;document.getElementById('questionText').textContent=q.question;document.getElementById('hint').classList.remove('show');document.getElementById('hint').textContent='';const el=document.getElementById('choices');el.innerHTML='';q.choices.forEach(c=>{const b=document.createElement('button');b.className='answer-choice';b.textContent=c;b.onclick=()=>answer(c);el.appendChild(b)})}
function answer(choice){const q=state.questions[state.qIndex];document.querySelectorAll('.answer-choice').forEach(b=>b.classList.add('lock'));if(choice===q.answer){const damage=state.monster.specialty===q.subject?2:1;state.points+=10;showFeedback(damage===2?'とくい！':'せいかい！',damage===2?'great':'good');state.monsterHp=Math.max(0,state.monsterHp-damage);updateHp();setTimeout(()=>{if(state.monsterHp<=0){document.getElementById('monsterImg').classList.add('defeat');setTimeout(nextQuestion,550)}else nextQuestion()},650)}else{showFeedback('おしい！','bad');if(!state.wrong.find(x=>x.id===q.id))state.wrong.push(q);document.getElementById('hint').textContent='ヒント：'+q.hint;document.getElementById('hint').classList.add('show');setTimeout(()=>document.querySelectorAll('.answer-choice').forEach(b=>b.classList.remove('lock')),500)}save()}
function updateHp(){document.getElementById('monsterHp').textContent=state.monsterHp;document.getElementById('monsterBar').style.width=(state.monsterHp/state.monster.hp*100)+'%';document.getElementById('monsterImg').classList.remove('hit');void document.getElementById('monsterImg').offsetWidth;document.getElementById('monsterImg').classList.add('hit')}
function showFeedback(t,c){const f=document.getElementById('feedback');f.textContent=t;f.className='feedback '+c;void f.offsetWidth;f.classList.add('show')}
function nextQuestion(){state.qIndex++;state.lastId=state.questions[state.qIndex-1]?.id;spawnMonster();renderQuestion()}
function finishBattle(){state.points+=20;save();document.getElementById('resultTitle').textContent='バトルクリア！';document.getElementById('resultText').textContent=state.questions.length+'問クリア！ モンスターをたおしたよ！';document.getElementById('resultPoints').textContent=20;show('result')}
function quitBattle(){if(confirm('バトルをやめる？'))show('home')}
function renderCards(){const el=document.getElementById('cardsGrid');el.innerHTML='';document.getElementById('cardCount').textContent=state.cards.length;state.cards.forEach(id=>{const c=MONSTERS.find(x=>x.id===id);if(!c)return;const d=document.createElement('div');d.className='card';d.innerHTML='<div class="card-inner"><span class="card-rare">'+c.rarity+'</span><img src="'+c.image+'"><div class="card-name">'+c.name+'</div><div class="card-meta">HP '+c.hp+'｜得意 '+c.specialty+'</div></div>';el.appendChild(d)})}
function openPack(){if(state.points<100){alert('100Pためよう！');return}state.points-=100;const c=MONSTERS[Math.floor(Math.random()*MONSTERS.length)];if(state.cards.includes(c.id)){state.points+=50}else state.cards.push(c.id);save();document.getElementById('newCard').innerHTML='<div class="card new-card"><div class="card-inner"><span class="card-rare">'+c.rarity+'</span><img src="'+c.image+'"><div class="card-name">'+c.name+'</div><div class="card-meta">HP '+c.hp+'｜得意 '+c.specialty+'</div></div></div>'+(state.cards.filter(x=>x===c.id).length>1?'<p>ダブり！ 50Pもどってきたよ。</p>':'<p>新しいカードをゲット！</p>');document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function renderReview(){const el=document.getElementById('reviewList');el.innerHTML=state.wrong.length?state.wrong.map(q=>'<div class="review-item"><b>'+q.subject+'</b><br>'+q.question+'<br><small>答え：'+q.answer+'</small></div>').join(''):'<p style="color:var(--muted)">まだ まちがえた問題はないよ！</p>'}
save();openSetup();show('home');
</script></body></html>

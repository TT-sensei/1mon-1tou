<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>教科モンスターバトル｜1問1とう</title>
<style>
:root{--bg:#101827;--panel:#1b2943;--panel2:#263957;--ink:#fff;--muted:#b9c6da;--gold:#ffd45a;--green:#62df9a;--red:#ff7777;--radius:20px}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#304d79,#101827 58%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif;min-height:100vh}button{font:inherit;border:0;cursor:pointer}.app{max-width:1200px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.brand{font-size:clamp(20px,3vw,30px);font-weight:1000}.brand small{display:block;font-size:11px;color:var(--muted)}.points{background:#101827;border:1px solid #fff2;border-radius:99px;padding:9px 15px;color:var(--gold);font-weight:1000}.screen{display:none}.screen.active{display:block}.panel{background:linear-gradient(145deg,#1d2b46,#142035);border:1px solid #fff2;border-radius:var(--radius);box-shadow:0 14px 40px #0007;padding:20px}.hero{text-align:center;padding:45px 20px}.hero h1{font-size:clamp(36px,7vw,72px);margin:0 0 10px}.hero p{color:var(--muted);line-height:1.8}.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;max-width:700px;margin:28px auto 0}.btn{min-height:62px;padding:14px 20px;border-radius:17px;background:linear-gradient(180deg,#314767,#243653);color:#fff;font-weight:1000;box-shadow:0 6px 0 #0b1220}.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #0b1220}.primary{background:linear-gradient(180deg,#f6c951,#d99d22);color:#241b07}.small{min-height:44px;padding:9px 14px;border-radius:13px;box-shadow:0 4px 0 #0b1220}.back{margin-bottom:14px}.title{font-size:27px;margin:0 0 18px}.choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.choice{min-height:76px;border-radius:17px;background:#263957;color:#fff;border:2px solid transparent;padding:12px;font-weight:1000}.choice.selected{border-color:var(--gold);background:#34476a}.choice .icon{font-size:25px;display:block}.choice small{color:var(--muted);font-size:11px}.battle{display:grid;grid-template-columns:220px minmax(300px,1fr) minmax(360px,1.1fr);gap:14px}.arena,.qpanel{min-height:590px}.arena{position:relative;overflow:hidden;border-radius:var(--radius);padding:18px;background:linear-gradient(180deg,#29435d,#18283b 65%,#101925);display:flex;flex-direction:column}.progress{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;font-weight:900}.monster-wrap{flex:1;display:flex;align-items:center;justify-content:center;position:relative}.monster{width:min(75%,350px);max-height:350px;object-fit:contain;filter:drop-shadow(0 20px 15px #0009)}.hit{animation:hit .35s}.defeat{animation:defeat .55s forwards}.hp-line{display:flex;justify-content:space-between;font-weight:1000;margin-bottom:6px}.bar{height:15px;background:#09101c;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ff6b6b,#ffb14e);transition:.3s;width:100%}.feedback{position:absolute;left:50%;top:45%;z-index:4;font-size:clamp(35px,6vw,70px);font-weight:1000;text-shadow:0 6px 18px #000;pointer-events:none;opacity:0;transform:translate(-50%,-50%)}.feedback.show{animation:pop .75s}.good{color:var(--green)}.great{color:var(--gold)}.bad{color:#ffaaaa}.qpanel{display:flex;flex-direction:column}.badge{display:inline-block;background:#fff1;border-radius:99px;padding:7px 10px;color:var(--muted);font-size:12px;font-weight:900}.qtext{font-size:clamp(25px,3.3vw,40px);font-weight:1000;line-height:1.5;margin:22px 0}.hint{display:none;background:#fff9d8;color:#493b00;padding:12px;border-radius:13px;font-weight:900;margin-bottom:10px}.hint.show{display:block}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:auto}.answer-choice{min-height:82px;border-radius:18px;background:#263957;color:#fff;border:2px solid #fff2;font-weight:1000;font-size:clamp(17px,2.2vw,25px);padding:10px;box-shadow:0 5px 0 #0b1220}.answer-choice:active{transform:translateY(3px);box-shadow:0 2px 0 #0b1220}.answer-choice.lock{pointer-events:none;opacity:.65}.mini-team{display:grid;gap:9px}.mini{display:grid;grid-template-columns:58px 1fr;gap:8px;align-items:center;background:#ffffff09;border-radius:13px;padding:7px;border:2px solid transparent}.mini.active{border-color:var(--gold)}.mini img{width:58px;height:58px;object-fit:contain}.mini b{font-size:12px}.mini span{display:block;color:var(--muted);font-size:10px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}.card{aspect-ratio:2/3;border-radius:18px;padding:8px;background:linear-gradient(145deg,#f9d768,#a87922 48%,#43320f);border:2px solid #ffe69a;box-shadow:0 10px 25px #0008;overflow:hidden}.card-inner{height:100%;border-radius:12px;padding:9px;background:linear-gradient(160deg,#263c59dd,#111a2ddd);display:flex;flex-direction:column}.card img{width:100%;flex:1;min-height:0;object-fit:contain}.card-rare{font-size:10px;color:#ffe18a;font-weight:1000}.card-name{font-weight:1000;font-size:14px}.card-meta{font-size:10px;color:#d6e1f0;margin-top:4px}.pack{text-align:center}.pack-box{width:min(260px,70vw);aspect-ratio:2/3;margin:20px auto;background:radial-gradient(circle,#ffe57b,#7d3c7d 55%,#17243a);border:5px solid #ffd65b;border-radius:25px;display:flex;align-items:center;justify-content:center;box-shadow:0 20px 50px #0008}.pack-box span{font-size:30px;font-weight:1000}.result{text-align:center}.reward{font-size:23px;color:var(--gold);font-weight:1000}.review-item{background:#ffffff09;border-radius:14px;padding:13px;margin:8px 0}.modal{position:fixed;inset:0;background:#050a12cc;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.show{display:flex}.modal-box{width:min(480px,100%);background:#1b2943;border:1px solid #fff2;border-radius:25px;padding:22px;text-align:center}.new-card{width:190px;margin:10px auto}@keyframes hit{25%{transform:translateX(15px) rotate(4deg);filter:brightness(1.8)}}@keyframes defeat{to{transform:scale(.1) rotate(25deg);opacity:0}}@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-65%) scale(1)}}@media(max-width:900px){.battle{grid-template-columns:1fr}.arena{order:1;min-height:430px}.qpanel{order:2;min-height:auto}.battle>aside{order:3}.mini-team{grid-template-columns:repeat(3,1fr)}.mini{grid-template-columns:1fr;text-align:center}.mini img{margin:auto}.choice-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.app{padding:10px}.menu{grid-template-columns:1fr}.panel{padding:14px}.choice-grid{grid-template-columns:1fr 1fr}.choices{gap:8px}.answer-choice{min-height:76px}.mini img{width:45px;height:45px}.mini span{display:none}}
</style>
<script src="data/subjects.js"></script>
<script src="data/questions/grade1/japanese.js"></script>
<script src="data/questions/grade1/math.js"></script>
<script src="data/questions/grade1/life.js"></script>
<script src="data/questions/grade1/english.js"></script>
</head>
<body><div class="app">
<header class="top"><div class="brand">教科モンスターバトル<small>1問1とう</small></div><div class="points">カードP <span id="points">0</span></div></header>
<section id="home" class="screen active"><div class="panel hero"><h1>教科モンスターバトル</h1><p>1問とく → こうげき！<br>モンスターをたおして、カードをあつめよう。</p><div class="menu"><button class="btn primary" onclick="openSetup()">バトルする</button><button class="btn" onclick="show('cards');renderCards()">カード</button><button class="btn" onclick="show('packs')">カードパック</button><button class="btn" onclick="show('review');renderReview()">まちがえた問題</button></div></div></section>
<section id="setup" class="screen"><button class="btn small back" onclick="show('home')">← もどる</button><div class="panel"><h2 class="title">バトルのじゅんび</h2><p>① 学年</p><div id="grades" class="choice-grid"></div><p>② 教科</p><div id="subjects" class="choice-grid"></div><div style="text-align:center;margin-top:20px"><button class="btn primary" onclick="startBattle()">バトルスタート！</button></div></div></section>
<section id="battleScreen" class="screen"><div class="battle"><aside><div class="panel"><div style="font-weight:1000;color:var(--muted);font-size:13px;margin-bottom:8px">ぼくのチーム</div><div id="miniTeam" class="mini-team"></div></div><div class="panel" style="margin-top:12px"><button class="btn small" style="width:100%" onclick="quitBattle()">やめる</button></div></aside><main class="arena"><div class="progress"><span id="battleInfo">1 / 5</span><span id="subjectInfo">国語</span></div><div class="monster-wrap"><img id="monsterImg" class="monster" alt="モンスター"><div id="feedback" class="feedback"></div></div><div><div class="hp-line"><span id="monsterName">モンスター</span><span><b id="monsterHp">1</b> / <b id="monsterMax">1</b></span></div><div class="bar"><i id="monsterBar"></i></div></div></main><section class="panel qpanel"><span id="qBadge" class="badge">1年・国語</span><div id="questionText" class="qtext">問題</div><div id="hint" class="hint"></div><div id="choices" class="choices"></div><div style="margin-top:12px;color:var(--muted);font-size:12px;font-weight:800">まちがえても大丈夫。ヒントを見て、もう一度考えよう！</div></section></div></section>
<section id="cards" class="screen"><button class="btn small back" onclick="show('home')">← もどる</button><div class="panel"><h2 class="title">モンスターカード</h2><p style="color:var(--muted)">持っているカード：<b id="cardCount">0</b>枚</p><div id="cardsGrid" class="cards"></div></div></section>
<section id="packs" class="screen"><button class="btn small back" onclick="show('home')">← もどる</button><div class="panel pack"><h2 class="title">カードパック</h2><p>100Pで1枚！ 同じカードなら50Pもどるよ。</p><div class="pack-box"><span>MONSTER<br>PACK</span></div><button class="btn primary" onclick="openPack()">100Pでひく</button></div></section>
<section id="review" class="screen"><button class="btn small back" onclick="show('home')">← もどる</button><div class="panel"><h2 class="title">まちがえた問題</h2><div id="reviewList"></div></div></section>
<section id="result" class="screen"><div class="panel result"><h2 id="resultTitle">バトル終了！</h2><p id="resultText"></p><div class="reward">+<span id="resultPoints">0</span>P</div><div style="margin-top:20px"><button class="btn primary" onclick="show('home')">ホームへ</button></div></div></section>
</div><div id="modal" class="modal"><div class="modal-box"><h2>NEW CARD!</h2><div id="newCard"></div><button class="btn primary" onclick="closeModal()">やった！</button></div></div>
<script>
const MONSTERS=[
{id:'purun-slime',name:'ぷるんスライム',hp:1,specialty:'算数',rarity:'ノーマル',image:'https://tt-sensei.github.io/navi-character-/assets/web/fantasy/monsters/zako/bubblefin-frog.webp'},
{id:'komorin-bat',name:'こもりんナイトバット',hp:1,specialty:'国語',rarity:'ノーマル',image:'https://tt-sensei.github.io/navi-character-/assets/web/fantasy/monsters/zako/dusk-feather-owl.webp'},
{id:'kinoko',name:'きのこっこ',hp:1,specialty:'生活',rarity:'ノーマル',image:'https://tt-sensei.github.io/navi-character-/assets/web/fantasy/monsters/zako/autumn-mushroom.webp'},
{id:'candy-slug',name:'キャンディスラッグ',hp:2,specialty:'英語',rarity:'レア',image:'https://tt-sensei.github.io/navi-character-/assets/web/fantasy/monsters/zako/candy-coral-slug.webp'},
{id:'cogwheel',name:'コグホイールビートル',hp:2,specialty:'算数',rarity:'レア',image:'https://tt-sensei.github.io/navi-character-/assets/web/fantasy/monsters/zako/cogwheel-beetle.webp'}];
const state={grade:1,subject:'国語',qIndex:0,questions:[],lastId:null,monster:null,monsterHp:1,points:+localStorage.getItem('1m1t_points')||0,cards:JSON.parse(localStorage.getItem('1m1t_cards')||'["purun-slime","komorin-bat","kinoko"]'),team:JSON.parse(localStorage.getItem('1m1t_team')||'["purun-slime","komorin-bat","kinoko"]'),wrong:JSON.parse(localStorage.getItem('1m1t_wrong')||'[]'),locked:false};
const $=id=>document.getElementById(id);function save(){localStorage.setItem('1m1t_points',state.points);localStorage.setItem('1m1t_cards',JSON.stringify(state.cards));localStorage.setItem('1m1t_team',JSON.stringify(state.team));localStorage.setItem('1m1t_wrong',JSON.stringify(state.wrong));$('points').textContent=state.points}function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');$('points').textContent=state.points}
function openSetup(){show('setup');renderGrades();renderSubjects()}
function renderGrades(){$('grades').innerHTML=[1,2,3,4,5,6].map(g=>`<button class="choice ${state.grade===g?'selected':''}" onclick="state.grade=${g};state.subject=getSubjectsForGrade(${g})[0];renderGrades();renderSubjects()">${g}年生</button>`).join('')}
function getSubjectsForGrade(g){return window.getSubjectsForGrade?window.getSubjectsForGrade(g):Object.keys(GAME_SUBJECTS).filter(s=>GAME_SUBJECTS[s].grades.includes(g))}
function renderSubjects(){const list=getSubjectsForGrade(state.grade);$('subjects').innerHTML=list.map(s=>`<button class="choice ${state.subject===s?'selected':''}" onclick="state.subject='${s}';renderSubjects()"><span class="icon">${GAME_SUBJECTS[s].icon}</span>${s}<small>${s==='英語'?'やさしい英語':s+'の もんだい'}</small></button>`).join('')+'<button class="choice" onclick="state.subject=\'ランダム\';renderSubjects()">🎲<br>教科ランダム</button>'}
function startBattle(){let subject=state.subject;if(subject==='ランダム')subject=getRandomSubjectLabel(state.grade);state.subject=subject;const bank=window.QUESTION_BANK?.[`${state.grade}-${GAME_SUBJECTS[subject]?.id}`]||[];if(!bank.length){alert(`${state.grade}年・${subject}の問題は、これから追加します。`);return}state.questions=shuffle([...bank]);state.qIndex=0;state.lastId=null;state.locked=false;show('battleScreen');renderTeam();nextMonster();renderQuestion()}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function nextMonster(){state.monster=MONSTERS[Math.floor(Math.random()*MONSTERS.length)];state.monsterHp=state.monster.hp;const img=$('monsterImg');img.className='monster';img.src=state.monster.image;$('monsterName').textContent=state.monster.name;$('monsterHp').textContent=state.monsterHp;$('monsterMax').textContent=state.monster.hp;$('monsterBar').style.width='100%'}
function renderQuestion(){const q=state.questions[state.qIndex%state.questions.length];state.current=q;$('battleInfo').textContent=`${Math.min(state.qIndex+1,5)} / 5`;$('subjectInfo').textContent=state.subject;$('qBadge').textContent=`${state.grade}年・${state.subject}`;$('questionText').textContent=q.question;$('hint').textContent=q.hint||'';$('hint').classList.remove('show');$('choices').innerHTML=shuffle(q.choices.map((c,i)=>({c,i}))).map((x,i)=>`<button class="answer-choice" data-value="${escapeAttr(x.c)}" onclick="answerChoice(this)">${['①','②','③','④'][i]} ${x.c}</button>`).join('');state.locked=false}
function escapeAttr(s){return String(s).replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;')}
function answerChoice(btn){if(state.locked)return;state.locked=true;const q=state.current;const value=btn.dataset.value;document.querySelectorAll('.answer-choice').forEach(b=>b.classList.add('lock'));if(value===String(q.answer)){correct();}else{wrong(q,value)}}
function feedback(text,cls){const f=$('feedback');f.textContent=text;f.className='feedback '+cls+' show';setTimeout(()=>f.className='feedback',750)}
function correct(){const damage=state.monster.specialty===state.subject?2:1;state.monsterHp=Math.max(0,state.monsterHp-damage);feedback(damage===2?'とくい！':'せいかい！',damage===2?'great':'good');const img=$('monsterImg');img.classList.remove('hit');void img.offsetWidth;img.classList.add('hit');$('monsterHp').textContent=state.monsterHp;$('monsterBar').style.width=(state.monsterHp/state.monster.hp*100)+'%';state.points+=10;if(state.monsterHp<=0){img.classList.add('defeat');setTimeout(()=>{state.qIndex++;if(state.qIndex>=5){finishBattle();}else{nextMonster();renderQuestion()}},550)}else{setTimeout(()=>{state.qIndex++;if(state.qIndex>=5)finishBattle();else renderQuestion()},500)}save()}
function wrong(q,value){feedback('おしい！','bad');$('hint').classList.add('show');state.wrong=state.wrong.filter(x=>x.id!==q.id);state.wrong.unshift({...q,lastAnswer:value});state.wrong=state.wrong.slice(0,30);save();setTimeout(()=>{state.locked=false;document.querySelectorAll('.answer-choice').forEach(b=>b.classList.remove('lock'))},500)}
function finishBattle(){$('resultTitle').textContent='バトルクリア！';$('resultText').textContent='5問の学習が終わったよ。';$('resultPoints').textContent=50;state.points+=50;save();show('result')}
function quitBattle(){show('home')}
function renderTeam(){$('miniTeam').innerHTML=state.team.map((id,i)=>{const c=MONSTERS.find(x=>x.id===id)||MONSTERS[0];return `<div class="mini ${i===0?'active':''}"><img src="${c.image}"><div><b>${c.name}</b><span>とくい：${c.specialty}</span></div></div>`}).join('')}
function cardHtml(c){return `<div class="card"><div class="card-inner"><div class="card-rare">${c.rarity}</div><img src="${c.image}" alt="${c.name}"><div class="card-name">${c.name}</div><div class="card-meta">HP ${c.hp}　とくい：${c.specialty}</div></div></div>`}
function renderCards(){$('cardCount').textContent=state.cards.length;$('cardsGrid').innerHTML=state.cards.map(id=>MONSTERS.find(x=>x.id===id)).filter(Boolean).map(cardHtml).join('')||'<div class="review-item">まだカードがないよ。</div>'}
function openPack(){if(state.points<100){alert('カードPがたりないよ。バトルしてためよう！');return}state.points-=100;const c=MONSTERS[Math.floor(Math.random()*MONSTERS.length)];let dup=state.cards.includes(c.id);if(!dup)state.cards.push(c.id);else state.points+=50;save();$('newCard').innerHTML=cardHtml(c);$('modal').classList.add('show')}
function closeModal(){$('modal').classList.remove('show')}
function renderReview(){if(!state.wrong.length){$('reviewList').innerHTML='<div class="review-item">まだ まちがえた問題はないよ！</div>';return}$('reviewList').innerHTML=state.wrong.map(q=>`<div class="review-item"><b>${q.question}</b><div style="color:var(--muted);margin-top:6px">こたえ：${q.answer}</div></div>`).join('')}
save();renderGrades();renderSubjects();
</script></body></html>

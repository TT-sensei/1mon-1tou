<style>
:root{--bg:#101827;--panel:#1b2943;--panel2:#263957;--ink:#fff;--muted:#c0cce0;--gold:#ffd45a;--green:#62df9a;--red:#ff9191;--radius:20px}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#355a90,#101827 58%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif;min-height:100vh}button{font:inherit;border:0;cursor:pointer}button:focus-visible{outline:4px solid #fff;outline-offset:3px}.app{max-width:1200px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.brand{font-size:clamp(20px,3vw,30px);font-weight:1000}.brand small{display:block;font-size:11px;color:var(--muted)}.points{background:#101827;border:1px solid #fff3;border-radius:99px;padding:9px 15px;color:var(--gold);font-weight:1000}.screen{display:none}.screen.active{display:block}.panel{background:linear-gradient(145deg,#1d2b46,#142035);border:1px solid #fff2;border-radius:var(--radius);box-shadow:0 14px 40px #0007;padding:20px}.hero{text-align:center;padding:45px 20px}.hero h1{font-size:clamp(36px,7vw,72px);margin:0 0 10px}.hero p,.muted{color:var(--muted);line-height:1.8}.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;max-width:700px;margin:28px auto 0}.btn{min-height:62px;padding:14px 20px;border-radius:17px;background:linear-gradient(180deg,#314767,#243653);color:#fff;font-weight:1000;box-shadow:0 6px 0 #0b1220}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:0 3px 0 #0b1220}.btn:not(:disabled):active{transform:translateY(4px);box-shadow:0 2px 0 #0b1220}.primary{background:linear-gradient(180deg,#f6c951,#d99d22);color:#241b07}.danger{background:linear-gradient(180deg,#a94b5e,#6a2838)}.small{min-height:44px;padding:9px 14px;border-radius:13px;box-shadow:0 4px 0 #0b1220}.back{margin-bottom:14px}.title{font-size:27px;margin:0 0 18px}.section-label{font-weight:1000;color:var(--muted);margin:18px 0 10px}.choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.choice{min-height:76px;border-radius:17px;background:#263957;color:#fff;border:2px solid transparent;padding:12px;font-weight:1000}.choice.selected{border-color:var(--gold);background:#34476a;box-shadow:0 0 0 3px #ffd45a22}.choice .icon{font-size:25px;display:block}.choice small{color:var(--muted);font-size:11px}.setup-note{text-align:center;color:var(--muted);font-size:13px;margin-top:15px}.battle{display:grid;grid-template-columns:220px minmax(280px,1fr) minmax(360px,1.15fr);gap:14px}.arena,.qpanel{min-height:590px}.arena{position:relative;overflow:hidden;border-radius:var(--radius);padding:18px;background:linear-gradient(180deg,#29435d,#18283b 65%,#101925);display:flex;flex-direction:column}.progress{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;font-weight:900}.monster-wrap{flex:1;display:flex;align-items:center;justify-content:center;position:relative}.monster{width:min(76%,350px);max-height:350px;object-fit:contain;filter:drop-shadow(0 20px 15px #0009)}.hit{animation:hit .35s}.defeat{animation:defeat .55s forwards}.hp-line{display:flex;justify-content:space-between;font-weight:1000;margin-bottom:6px}.bar{height:15px;background:#09101c;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ff6b6b,#ffb14e);transition:.35s;width:100%}.feedback{position:absolute;left:50%;top:45%;z-index:4;font-size:clamp(35px,6vw,70px);font-weight:1000;text-shadow:0 6px 18px #000;pointer-events:none;opacity:0;transform:translate(-50%,-50%)}.feedback.show{animation:pop .78s}.good{color:var(--green)}.great{color:var(--gold)}.bad{color:#ffaaaa}.qpanel{display:flex;flex-direction:column}.badge{display:inline-block;background:#fff1;border-radius:99px;padding:7px 10px;color:var(--muted);font-size:12px;font-weight:900}.qtext{font-size:clamp(25px,3.3vw,40px);font-weight:1000;line-height:1.5;margin:22px 0}.hint{display:none;background:#fff9d8;color:#493b00;padding:12px;border-radius:13px;font-weight:900;margin-bottom:10px}.hint.show{display:block}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:auto}.answer-choice{min-height:82px;border-radius:18px;background:#263957;color:#fff;border:2px solid #fff2;font-weight:1000;font-size:clamp(17px,2.2vw,25px);padding:10px;box-shadow:0 5px 0 #0b1220}.answer-choice:active{transform:translateY(3px);box-shadow:0 2px 0 #0b1220}.answer-choice.lock{pointer-events:none;opacity:.65}.mini-team{display:grid;gap:9px}.mini{display:grid;grid-template-columns:58px 1fr;gap:8px;align-items:center;background:#ffffff09;border-radius:13px;padding:7px;border:2px solid transparent}.mini.active{border-color:var(--gold)}.mini img{width:58px;height:58px;object-fit:contain}.mini b{font-size:12px}.mini span{display:block;color:var(--muted);font-size:10px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}.card{position:relative;aspect-ratio:3/4;border-radius:15px;overflow:hidden;background:#1a2940;box-shadow:0 10px 25px #0008;color:#fff}.card-layer{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.card-frame{z-index:1}.card-monster{z-index:2;object-fit:contain;padding:14% 9% 19%;filter:drop-shadow(0 9px 7px #0009)}.card-copy{position:absolute;z-index:3;inset:auto 8px 8px;color:#fff;text-shadow:0 2px 3px #000;font-weight:1000}.card-rank{font-size:10px;color:#ffe18a}.card-name{font-size:14px}.card-meta{font-size:10px}.card.unknown .card-layer{object-fit:cover}.card.unknown .card-copy{inset:45% 0 auto;text-align:center;font-size:22px}.card.selected-card{outline:4px solid var(--gold);outline-offset:2px}.card-button{padding:0;border:0;background:transparent;text-align:left}.pack{text-align:center}.pack-card{width:min(240px,65vw);margin:20px auto;perspective:900px}.pack-card-inner{position:relative;width:100%;aspect-ratio:3/4;transform-style:preserve-3d;transition:transform .7s}.pack-card.revealed .pack-card-inner{transform:rotateY(180deg)}.pack-face{position:absolute;inset:0;backface-visibility:hidden}.pack-front{transform:rotateY(180deg)}.pack-card.shaking{animation:shake .5s 2}.review-item{background:#ffffff09;border-radius:14px;padding:13px;margin:8px 0}.review-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.modal{position:fixed;inset:0;background:#050a12cc;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.show{display:flex}.modal-box{width:min(480px,100%);background:#1b2943;border:1px solid #fff2;border-radius:25px;padding:22px;text-align:center}.new-card{width:190px;margin:10px auto}.setting-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #fff2}@keyframes hit{25%{transform:translateX(15px) rotate(4deg);filter:brightness(1.8)}}@keyframes defeat{to{transform:scale(.1) rotate(25deg);opacity:0}}@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-65%) scale(1)}}@keyframes shake{20%,60%{transform:rotate(-3deg)}40%,80%{transform:rotate(3deg)}}@media(max-width:900px){.battle{grid-template-columns:1fr}.arena{order:1;min-height:410px}.qpanel{order:2;min-height:auto}.battle>aside{order:3}.mini-team{grid-template-columns:repeat(3,1fr)}.mini{grid-template-columns:1fr;text-align:center}.mini img{margin:auto}.choice-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.app{padding:10px}.menu{grid-template-columns:1fr}.panel{padding:14px}.choice-grid{grid-template-columns:1fr 1fr}.choices{gap:8px}.answer-choice{min-height:76px}.mini img{width:45px;height:45px}.mini span{display:none}}
</style>

<script src="data/questions/grade1/japanese.js"></script><script src="data/questions/grade1/math.js"></script><script src="data/questions/grade1/life.js"></script><script src="data/questions/grade1/english.js"></script>
<script src="data/questions/grade2/japanese.js"></script><script src="data/questions/grade2/math.js"></script><script src="data/questions/grade2/life.js"></script><script src="data/questions/grade2/english.js"></script>

<body><div class="app">
<header class="top"><div class="brand">教科モンスターバトル<small>1問1とう</small></div><div class="points">カードP <span id="points">0</span></div></header>
<section id="home" class="screen active"><div class="panel hero"><h1>教科モンスターバトル</h1><p>1問とく → こうげき！<br>モンスターをたおして、カードをあつめよう。</p><div class="menu"><button class="btn primary" onclick="openSetup()">バトルする</button><button class="btn" onclick="show('cards');renderCards()">カード・チーム</button><button class="btn" onclick="show('packs');renderPack()">カードパック</button><button class="btn" onclick="show('review');renderReview()">まちがえた問題</button><button class="btn" onclick="show('settings');renderSettings()">せってい</button></div></div></section>
<section id="setup" class="screen"><button class="btn small back" onclick="show('home')">← もどる</button><div class="panel"><h2 class="title">バトルのじゅんび</h2><div class="section-label">① 学年をえらぼう</div><div id="grades" class="choice-grid"></div><div class="section-label">② 教科をえらぼう</div><div id="subjects" class="choice-grid"></div><div id="setupNote" class="setup-note"></div><div style="text-align:center;margin-top:20px"><button class="btn primary" onclick="startBattle()">バトルスタート！</button></div></div></section>
<section id="battleScreen" class="screen"><div class="battle"><aside><div class="panel"><div class="muted" style="font-weight:1000;font-size:13px;margin-bottom:8px">ぼくのチーム</div><div id="miniTeam" class="mini-team"></div></div><div class="panel" style="margin-top:12px"><button class="btn small" style="width:100%" onclick="quitBattle()">やめる</button></div></aside><main class="arena"><div class="progress"><span id="battleInfo">1 / 3</span><span id="subjectInfo">国語</span></div><div class="monster-wrap"><img id="monsterImg" class="monster" alt="出現したモンスター"><div id="feedback" class="feedback" aria-live="polite"></div></div><div><div class="hp-line"><span id="monsterName">モンスター</span><span><b id="monsterHp">1</b> / <b id="monsterMax">1</b></span></div><div class="bar"><i id="monsterBar"></i></div></div></main><section class="panel qpanel"><span id="qBadge" class="badge">1年・国語</span><div id="questionText" class="qtext">問題</div><div id="hint" class="hint"></div><div id="choices" class="choices"></div><div class="muted" style="margin-top:12px;font-size:12px;font-weight:800">まちがえても大丈夫。ヒントを見て、もう一度考えよう！</div></section></div></section>
<section id="cards" class="screen"><button class="btn small back" onclick="show('home')">← もどる</button><div class="panel"><h2 class="title">モンスターカード</h2><p class="muted">持っているカード：<b id="cardCount">0</b>枚　｜　チームは最大3枚。カードをタップしてえらぼう。</p><div id="cardsGrid" class="cards"></div></div></section>
<section id="packs" class="screen"><button class="btn small back" onclick="show('home')">← もどる</button><div class="panel pack"><h2 class="title">カードパック</h2><p class="muted">100Pで1枚！ 同じカードなら50Pもどるよ。</p><div id="packVisual"></div><p id="packMessage" aria-live="polite">なにが出るかな？</p><button id="packButton" class="btn primary" onclick="openPack()">100Pでひく</button></div></section>
<section id="review" class="screen"><button class="btn small back" onclick="show('home')">← もどる</button><div class="panel"><h2 class="title">まちがえた問題</h2><div id="reviewList"></div></div></section>
<section id="settings" class="screen"><button class="btn small back" onclick="show('home')">← もどる</button><div class="panel"><h2 class="title">せってい</h2><div id="settingsList"></div></div></section>
<section id="result" class="screen"><div class="panel result"><h2 id="resultTitle">バトル終了！</h2><p id="resultText" class="muted"></p><div class="reward">+<span id="resultPoints">0</span>P</div><div style="margin-top:20px"><button class="btn primary" onclick="show('home')">ホームへ</button></div></div></section>
</div><div id="modal" class="modal"><div class="modal-box"><h2 id="modalTitle">NEW CARD!</h2><div id="newCard"></div><button class="btn primary" onclick="closeModal()">やった！</button></div></div>
<script>
const ASSETS={back:'assets/cards/backs/card-back.jpeg',frames:{zako:'assets/cards/frames/zako.png',evolved:'assets/cards/frames/zako-evolved.png',boss:'assets/cards/frames/boss.png'},backgrounds:{zako:['assets/cards/backgrounds/zako/grassland.jpeg','assets/cards/backgrounds/zako/forest.jpeg','assets/cards/backgrounds/zako/hill.jpeg'],evolved:['assets/cards/backgrounds/zako/sunset.jpeg','assets/cards/backgrounds/zako/stars.jpeg','assets/cards/backgrounds/zako/waterfall.jpeg'],boss:['assets/cards/backgrounds/boss/volcano.jpeg','assets/cards/backgrounds/boss/palace.jpeg','assets/cards/backgrounds/boss/sacred-place.jpeg']}};
const MONSTERS=[
{id:'purun-slime',name:'ぷるんスライム',rank:'zako',hp:1,specialty:'算数',rarity:'ノーマル',image:'https://tt-sensei.github.io/navi-character-/assets/web/fantasy/monsters/zako/bubblefin-frog.webp'},
{id:'komorin-bat',name:'こもりんナイトバット',rank:'zako',hp:1,specialty:'国語',rarity:'ノーマル',image:'https://tt-sensei.github.io/navi-character-/assets/web/fantasy/monsters/zako/dusk-feather-owl.webp'},
{id:'kinoko',name:'きのこっこ',rank:'zako',hp:1,specialty:'生活',rarity:'ノーマル',image:'https://tt-sensei.github.io/navi-character-/assets/web/fantasy/monsters/zako/autumn-mushroom.webp'},
{id:'candy-slug',name:'キャンディスラッグ',rank:'evolved',hp:2,specialty:'英語',rarity:'レア',image:'https://tt-sensei.github.io/navi-character-/assets/web/fantasy/monsters/zako/candy-coral-slug.webp'},
{id:'cogwheel',name:'コグホイールビートル',rank:'evolved',hp:2,specialty:'算数',rarity:'レア',image:'https://tt-sensei.github.io/navi-character-/assets/web/fantasy/monsters/zako/cogwheel-beetle.webp'},
{id:'slime-king',name:'ぷるんキング',rank:'boss',hp:3,specialty:'算数',rarity:'ボス',image:'https://tt-sensei.github.io/navi-character-/assets/web/fantasy/monsters/zako/bubblefin-frog.webp'}];
const INITIAL={points:0,cards:['purun-slime','komorin-bat','kinoko'],team:['purun-slime','komorin-bat','kinoko'],wrong:[],settings:{sound:true,effects:true}};
function stored(key,fallback){try{const value=JSON.parse(localStorage.getItem(key));return value??fallback}catch{return fallback}}
function validCards(value){return Array.isArray(value)?[...new Set(value.filter(id=>MONSTERS.some(m=>m.id===id)))]:INITIAL.cards}
const state={grade:1,subject:'国語',pool:[],usedIds:[],currentQuestion:null,encounter:0,monster:null,monsterHp:1,correct:0,rewarded:false,answerLocked:false,packOpening:false,points:Math.max(0,Number(localStorage.getItem('1m1t_points'))||0),cards:validCards(stored('1m1t_cards',INITIAL.cards)),team:validCards(stored('1m1t_team',INITIAL.team)).slice(0,3),wrong:stored('1m1t_wrong',INITIAL.wrong),settings:{...INITIAL.settings,...stored('1m1t_settings',INITIAL.settings)}};
if(!Array.isArray(state.wrong))state.wrong=[]; if(!state.team.length)state.team=[state.cards[0]||INITIAL.cards[0]];
function save(){state.points=Math.max(0,Math.floor(Number(state.points)||0));localStorage.setItem('1m1t_points',state.points);localStorage.setItem('1m1t_cards',JSON.stringify(state.cards));localStorage.setItem('1m1t_team',JSON.stringify(state.team));localStorage.setItem('1m1t_wrong',JSON.stringify(state.wrong));localStorage.setItem('1m1t_settings',JSON.stringify(state.settings));document.getElementById('points').textContent=state.points}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0)}
function availableSubjects(grade){return Object.keys(window.GAME_SUBJECTS).filter(name=>{const d=window.GAME_SUBJECTS[name];return d.grades.includes(grade)&&(window.QUESTION_BANK?.[grade+'-'+d.id]||[]).length})}
function openSetup(){show('setup');renderGrades();renderSubjects()}
function renderGrades(){const el=document.getElementById('grades');el.innerHTML='';for(let g=1;g<=6;g++){const b=document.createElement('button');b.className='choice'+(state.grade===g?' selected':'');b.innerHTML='<span class="icon">🎒</span>'+g+'年生';b.onclick=()=>{state.grade=g;state.subject=null;renderGrades();renderSubjects()};el.appendChild(b)}}
function renderSubjects(){const el=document.getElementById('subjects'),list=availableSubjects(state.grade);el.innerHTML='';if(!state.subject||(!list.includes(state.subject)&&state.subject!=='おまかせ'))state.subject=list[0]||null;list.forEach(s=>{const d=window.GAME_SUBJECTS[s],b=document.createElement('button');b.className='choice'+(state.subject===s?' selected':'');b.innerHTML='<span class="icon">'+d.icon+'</span>'+s;b.onclick=()=>{state.subject=s;renderSubjects()};el.appendChild(b)});const r=document.createElement('button');r.className='choice'+(state.subject==='おまかせ'?' selected':'');r.innerHTML='<span class="icon">🎲</span>おまかせ<small>この学年の教科から</small>';r.disabled=!list.length;r.onclick=()=>{state.subject='おまかせ';renderSubjects()};el.appendChild(r);document.getElementById('setupNote').textContent=list.length?(state.subject==='おまかせ'?state.grade+'年生で使える教科から、今回の教科をえらぶよ。':state.grade+'年生・'+state.subject+'をえらんでいるよ。'):'この学年の問題は、まだ準備中です。'}
function shuffle(list){return [...list].sort(()=>Math.random()-.5)}
function prepareQuestions(){const subjects=state.subject==='おまかせ'?availableSubjects(state.grade):[state.subject];const selected=state.subject==='おまかせ'?subjects[Math.floor(Math.random()*subjects.length)]:state.subject;const id=window.GAME_SUBJECTS[selected]?.id;const questions=window.QUESTION_BANK?.[state.grade+'-'+id]||[];return {selected,questions:shuffle(questions)}}
function startBattle(){const battle=prepareQuestions();if(!battle.questions.length){alert('この学年・教科の問題は、まだ準備中だよ。');return}state.subject=battle.selected;state.pool=battle.questions;state.usedIds=[];state.encounter=0;state.correct=0;state.rewarded=false;show('battleScreen');renderTeam();spawnMonster();nextQuestion()}
function monsterForRank(rank){const choices=MONSTERS.filter(m=>m.rank===rank);return choices[Math.floor(Math.random()*choices.length)]||MONSTERS[0]}
function spawnMonster(){const ranks=['zako','evolved','boss'];state.monster=monsterForRank(ranks[state.encounter]||'boss');state.monsterHp=state.monster.hp;const img=document.getElementById('monsterImg');img.src=state.monster.image;img.className='monster';img.onerror=()=>{img.onerror=null;img.src=ASSETS.back};document.getElementById('monsterName').textContent=state.monster.name;document.getElementById('monsterHp').textContent=state.monsterHp;document.getElementById('monsterMax').textContent=state.monster.hp;document.getElementById('monsterBar').style.width='100%'}
function renderTeam(){const el=document.getElementById('miniTeam');el.innerHTML='';state.team.forEach(id=>{const c=MONSTERS.find(x=>x.id===id);if(!c)return;const d=document.createElement('div');d.className='mini';d.innerHTML='<img alt="" src="'+c.image+'"><div><b>'+c.name+'</b><span>得意：'+c.specialty+'</span></div>';d.querySelector('img').onerror=e=>e.currentTarget.src=ASSETS.back;el.appendChild(d)})}
function nextQuestion(){let candidates=state.pool.filter(q=>q.id!==state.currentQuestion?.id&&!state.usedIds.includes(q.id));if(!candidates.length){state.usedIds=[];candidates=state.pool.filter(q=>q.id!==state.currentQuestion?.id);if(!candidates.length)candidates=state.pool}state.currentQuestion=candidates[Math.floor(Math.random()*candidates.length)];state.usedIds.push(state.currentQuestion.id);renderQuestion()}
function renderQuestion(){const q=state.currentQuestion;if(!q)return finishBattle();state.answerLocked=false;document.getElementById('battleInfo').textContent=(state.encounter+1)+' / 3 たい';document.getElementById('subjectInfo').textContent=q.subject;document.getElementById('qBadge').textContent=q.grade+'年・'+q.subject;document.getElementById('questionText').textContent=q.question;const hint=document.getElementById('hint');hint.classList.remove('show');hint.textContent='';const el=document.getElementById('choices');el.innerHTML='';q.choices.forEach(c=>{const b=document.createElement('button');b.className='answer-choice';b.textContent=c;b.onclick=()=>answer(c);el.appendChild(b)})}
function recordWrong(q){const current=state.wrong.find(x=>x.id===q.id);if(current){current.count=(Number(current.count)||1)+1;current.lastWrongAt=new Date().toISOString()}else state.wrong.push({id:q.id,question:q.question,choices:q.choices,answer:q.answer,hint:q.hint||'答えを見なおしてみよう。',grade:q.grade,subject:q.subject,count:1,lastWrongAt:new Date().toISOString()});save()}
function answer(choice){if(state.answerLocked)return;state.answerLocked=true;const q=state.currentQuestion;document.querySelectorAll('.answer-choice').forEach(b=>b.classList.add('lock'));if(choice===q.answer){const damage=state.monster.specialty===q.subject?2:1;state.points+=10;state.correct++;showFeedback(damage===2?'とくい！ −'+damage:'せいかい！ −'+damage,damage===2?'great':'good');state.monsterHp=Math.max(0,state.monsterHp-damage);updateHp();save();setTimeout(()=>{if(state.monsterHp<=0){document.getElementById('monsterImg').classList.add('defeat');setTimeout(defeatMonster,520)}else nextQuestion()},680)}else{recordWrong(q);showFeedback('おしい！','bad');const hint=document.getElementById('hint');hint.textContent='ヒント：'+(q.hint||'問題をもう一度よく読んでみよう。');hint.classList.add('show');setTimeout(()=>{state.answerLocked=false;document.querySelectorAll('.answer-choice').forEach(b=>b.classList.remove('lock'))},450)}}
function updateHp(){document.getElementById('monsterHp').textContent=state.monsterHp;document.getElementById('monsterBar').style.width=(state.monsterHp/state.monster.hp*100)+'%';const img=document.getElementById('monsterImg');img.classList.remove('hit');void img.offsetWidth;img.classList.add('hit')}
function showFeedback(t,c){const f=document.getElementById('feedback');f.textContent=t;f.className='feedback '+c;if(!state.settings.effects){f.style.opacity='1';setTimeout(()=>f.style.opacity='',500);return}void f.offsetWidth;f.classList.add('show')}
function defeatMonster(){state.encounter++;if(state.encounter>=3)finishBattle();else{spawnMonster();nextQuestion()}}
function finishBattle(){if(state.rewarded)return;state.rewarded=true;const bonus=20;state.points+=bonus;save();document.getElementById('resultTitle').textContent='バトルクリア！';document.getElementById('resultText').textContent=state.correct+'問正解！ 3たいのモンスターをたおしたよ！ 正解ごとに10P、クリアで'+bonus+'Pをもらったよ。';document.getElementById('resultPoints').textContent=bonus;show('result')}
function quitBattle(){if(confirm('バトルをやめる？'))show('home')}
function cardHtml(c,extra=''){const bg=ASSETS.backgrounds[c.rank][Math.abs([...c.id].reduce((n,x)=>n+x.charCodeAt(0),0))%ASSETS.backgrounds[c.rank].length];return '<div class="card '+extra+'"><img class="card-layer" src="'+bg+'" alt=""><img class="card-layer card-frame" src="'+ASSETS.frames[c.rank]+'" alt=""><img class="card-layer card-monster" src="'+c.image+'" alt="'+c.name+'"><div class="card-copy"><div class="card-rank">'+c.rarity+' / HP '+c.hp+'</div><div class="card-name">'+c.name+'</div><div class="card-meta">得意：'+c.specialty+'</div></div></div>'}
function renderCards(){const el=document.getElementById('cardsGrid');document.getElementById('cardCount').textContent=state.cards.length;el.innerHTML='';state.cards.forEach(id=>{const c=MONSTERS.find(x=>x.id===id);if(!c)return;const b=document.createElement('button');b.className='card-button';b.innerHTML=cardHtml(c,state.team.includes(id)?'selected-card':'');b.onclick=()=>toggleTeam(id);b.querySelectorAll('.card-monster').forEach(i=>i.onerror=()=>i.src=ASSETS.back);el.appendChild(b)});if(state.cards.length<MONSTERS.length){const d=document.createElement('div');d.className='card unknown';d.innerHTML='<img class="card-layer" src="'+ASSETS.back+'" alt="まだ見つけていないカード"><div class="card-copy">？？？</div>';el.appendChild(d)}}
function toggleTeam(id){if(state.team.includes(id))state.team=state.team.filter(x=>x!==id);else if(state.team.length<3)state.team.push(id);else{alert('チームは3枚までだよ。入れかえたいカードをもう一度タップして外そう。');return}if(!state.team.length){state.team=[id];}save();renderCards()}
function renderPack(){const el=document.getElementById('packVisual');el.innerHTML='<div class="pack-card"><div class="pack-card-inner"><div class="pack-face">'+unknownCard()+'</div><div class="pack-face pack-front" id="packFront"></div></div></div>';document.getElementById('packMessage').textContent='なにが出るかな？';document.getElementById('packButton').disabled=state.packOpening}
function unknownCard(){return '<div class="card unknown"><img class="card-layer" src="'+ASSETS.back+'" alt="カードの裏面"><div class="card-copy">？</div></div>'}
function openPack(){if(state.packOpening||state.points<100){if(state.points<100)alert('100Pためよう！');return}state.packOpening=true;state.points-=100;save();const button=document.getElementById('packButton'),card=document.querySelector('.pack-card');button.disabled=true;card.classList.add('shaking');document.getElementById('packMessage').textContent='なにが出るかな？';const c=MONSTERS[Math.floor(Math.random()*MONSTERS.length)],isNew=!state.cards.includes(c.id);setTimeout(()=>{if(isNew)state.cards.push(c.id);else state.points+=50;save();document.getElementById('packFront').innerHTML=cardHtml(c);card.classList.remove('shaking');card.classList.add('revealed');document.getElementById('packMessage').textContent=isNew?'NEW! '+c.name+' をゲット！':'GET! ダブりなので50Pもどったよ。';setTimeout(()=>{state.packOpening=false;button.disabled=false},750)},900)}
function renderReview(){const el=document.getElementById('reviewList');el.innerHTML='';if(!state.wrong.length){el.innerHTML='<p class="muted">まだ まちがえた問題はないよ！</p>';return}state.wrong.sort((a,b)=>new Date(b.lastWrongAt)-new Date(a.lastWrongAt)).forEach(q=>{const d=document.createElement('div');d.className='review-item';d.innerHTML='<b>'+q.grade+'年・'+q.subject+'</b>　まちがえた：'+q.count+'回<br><strong>'+q.question+'</strong><div class="review-actions"><button class="btn small primary">復習する</button></div>';d.querySelector('button').onclick=()=>openReviewQuestion(q);el.appendChild(d)})}
function openReviewQuestion(q){document.getElementById('modalTitle').textContent='復習チャレンジ';const el=document.getElementById('newCard');el.innerHTML='<p><b>'+q.grade+'年・'+q.subject+'</b></p><p>'+q.question+'</p><div id="reviewChoices" class="choices"></div><div id="reviewHint" class="hint show">ヒント：'+q.hint+'</div>';q.choices.forEach(choice=>{const b=document.createElement('button');b.className='answer-choice';b.textContent=choice;b.onclick=()=>{if(choice===q.answer){state.wrong=state.wrong.filter(x=>x.id!==q.id);save();document.getElementById('modalTitle').textContent='できた！';el.innerHTML='<p>せいかい！ この問題は復習リストから卒業したよ。</p>'}else{document.getElementById('modalTitle').textContent='おしい！ もう一度考えよう';recordWrong(q)}};el.querySelector('#reviewChoices').appendChild(b)});document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show');renderReview()}
function renderSettings(){const el=document.getElementById('settingsList');el.innerHTML='<div class="setting-row"><span>演出を表示する</span><input id="effects" type="checkbox" '+(state.settings.effects?'checked':'')+'></div><div class="setting-row"><span>音（準備中）</span><input id="sound" type="checkbox" '+(state.settings.sound?'checked':'')+'></div><div class="setting-row"><button class="btn small danger" id="reset">保存データをリセット</button></div>';el.querySelector('#effects').onchange=e=>{state.settings.effects=e.target.checked;save()};el.querySelector('#sound').onchange=e=>{state.settings.sound=e.target.checked;save()};el.querySelector('#reset').onclick=()=>{if(confirm('カードP、カード、チーム、復習データをすべて消します。よろしいですか？')){Object.keys(localStorage).filter(k=>k.startsWith('1m1t_')).forEach(k=>localStorage.removeItem(k));location.reload()}}}
save();
</script></body></html>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f3ee">
<title>教科モンスターバトル｜1問1とう</title>
<link rel="stylesheet" href="https://tt-sensei.github.io/edu-effects/css/edu-effects.css">
<link rel="stylesheet" href="https://tt-sensei.github.io/edu-effects/css/edu-learning.css">
<link rel="stylesheet" href="https://tt-sensei.github.io/edu-effects/css/edu-feedback.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/battle.css">
<script src="data/subjects.js"></script>
<script src="data/monsters.js"></script>
<script src="data/cards.js"></script>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand">教科モンスターバトル<small>1問1とう</small></div>
  <div class="points">カードP <span id="points">0</span></div>
</header>

<main>
<section id="home" class="screen active" aria-labelledby="homeTitle">
  <div class="home-shell">
    <div class="home-heading">
      <div>
        <p class="eyebrow">1問1とう</p>
        <h1 id="homeTitle">教科モンスターバトル</h1>
        <p class="home-lead">1問とく。カードがこうげきする。<br>学びながら、モンスターに挑戦しよう。</p>
      </div>
      <div class="home-visual" aria-hidden="true">
        <img src="https://tt-sensei.github.io/navi-character-/assets/web/groups/group-start-dash.png" alt="">
      </div>
    </div>
    <div class="home-actions">
      <button class="home-action main" data-action="setup"><span class="action-index">01</span><span class="action-title">バトルする</span><span class="action-note">学年と教科をえらんでスタート</span><span class="action-arrow">→</span></button>
      <button class="home-action" data-action="cards"><span class="action-index">02</span><span class="action-title">カード・チーム</span><span class="action-note">3枚のデッキをつくる</span><span class="action-arrow">→</span></button>
      <button class="home-action" data-action="packs"><span class="action-index">03</span><span class="action-title">カードパック</span><span class="action-note">カードを集める</span><span class="action-arrow">→</span></button>
      <button class="home-action" data-action="review"><span class="action-index">04</span><span class="action-title">まちがえた問題</span><span class="action-note">もう一度、できるようにする</span><span class="action-arrow">→</span></button>
    </div>
    <div class="home-footer"><button class="home-settings" data-action="settings">せってい</button><span>カードP <b id="homePoints">0</b></span></div>
  </div>
</section>

<section id="setup" class="screen" aria-labelledby="setupTitle">
  <button class="btn small back" data-action="home">← もどる</button>
  <div class="panel">
    <h2 id="setupTitle" class="title">バトルのじゅんび</h2>
    <div class="section-label">① 学年をえらぼう</div>
    <div id="grades" class="choice-grid"></div>
    <div class="section-label">② 教科をえらぼう</div>
    <div id="subjects" class="choice-grid"></div>
    <p id="setupNote" class="setup-note"></p>
    <div style="text-align:center;margin-top:18px">
      <button id="startBattleButton" class="btn primary" style="min-width:min(360px,100%)">⚔️ バトルスタート！</button>
    </div>
  </div>
</section>

<section id="battleScreen" class="screen" aria-label="バトル画面"></section>

<section id="cards" class="screen" aria-labelledby="cardsTitle">
  <button class="btn small back" data-action="home">← もどる</button>
  <div class="panel">
    <h2 id="cardsTitle" class="title">🃏 カード・チーム編成</h2><div id="teamDeck" class="team-deck" aria-label="バトルデッキ3枚"></div>
    <p class="muted">カードをタップしてチームに入れることができます。最大3枚。</p>
    <div class="card-tools">
      <div class="card-tool-row"><span>教科</span><div class="card-filters">
        <button class="filter-btn selected" data-card-filter="all">すべて</button>
        <button class="filter-btn" data-card-filter="国語">国語</button>
        <button class="filter-btn" data-card-filter="算数">算数</button>
        <button class="filter-btn" data-card-filter="理科">理科</button>
        <button class="filter-btn" data-card-filter="社会">社会</button>
        <button class="filter-btn" data-card-filter="英語">英語</button>
        <button class="filter-btn" data-card-filter="生活">生活</button>
      </div></div>
      <div class="card-tool-row"><span>並び順</span><div class="card-filters">
        <button class="filter-btn selected" data-card-sort="selected">チーム優先</button>
        <button class="filter-btn" data-card-sort="rarity">レア度</button>
        <button class="filter-btn" data-card-sort="subject">教科</button>
        <button class="filter-btn" data-card-sort="name">名前</button>
      </div><span id="cardCount" class="card-count"></span></div>
    </div>
    <div id="cardsGrid" class="cards"></div>
  </div>
</section>

<section id="packs" class="screen" aria-labelledby="packsTitle">
  <button class="btn small back" data-action="home">← もどる</button>
  <div class="panel" style="text-align:center">
    <h2 id="packsTitle" class="title">🎁 カードパック</h2>
    <p class="muted">100Pで1枚。新しいカードを集めよう。</p>
    <div id="packVisual"></div>
    <p id="packMessage" class="muted">なにが出るかな？</p>
    <button id="packButton" class="btn primary">100Pでひく</button>
  </div>
</section>

<section id="review" class="screen" aria-labelledby="reviewTitle">
  <button class="btn small back" data-action="home">← もどる</button>
  <div class="panel">
    <h2 id="reviewTitle" class="title">📚 まちがえた問題</h2>
    <div id="reviewList"></div>
  </div>
</section>

<section id="settings" class="screen" aria-labelledby="settingsTitle">
  <button class="btn small back" data-action="home">← もどる</button>
  <div class="panel">
    <h2 id="settingsTitle" class="title">⚙️ せってい</h2>
    <div class="setting-row"><span>カードP</span><b id="settingsPoints">0</b></div>
    <div class="setting-row"><span>保存データ</span><button id="resetButton" class="btn small danger">リセット</button></div>
  </div>
</section>
</main>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
